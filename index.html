<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/alpine_logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Alpine Explorers - Travel & Tourism</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="dns-prefetch" href="https://images.unsplash.com">
    <!-- Reduced font weights: Cinzel 700+900, Playfair 700 italic+regular, Caveat 600, Inter 400+600 only -->
    <!-- Using media="print" onload trick for non-blocking font load; noscript fallback included -->
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Playfair+Display:ital,wght@0,700;1,600&family=Caveat:wght@600&family=Inter:wght@400;600&display=swap">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Playfair+Display:ital,wght@0,700;1,600&family=Caveat:wght@600&family=Inter:wght@400;600&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
    <noscript><link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Playfair+Display:ital,wght@0,700;1,600&family=Caveat:wght@600&family=Inter:wght@400;600&display=swap" rel="stylesheet"></noscript>
    <script>
      try { var t = localStorage.getItem('ae-selected-theme'); if (t) document.documentElement.setAttribute('data-theme', t); } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
